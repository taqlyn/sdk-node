name: Publish to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@taqlyn/sdk-node
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Build TypeScript library
        run: bun run build
      - name: Run tests
        run: bun test
      - name: Publish to NPM (OIDC Trusted Publishing)
        run: npx -y npm@11.19.1 stage publish --provenance --access public
