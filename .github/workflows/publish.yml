name: Publish to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for NPM Trusted Publishing (OIDC tokenless) & Sigstore provenance

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build TypeScript library
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Publish to NPM (Tokenless Trusted Publishing)
        # Ephemeral OIDC token exchange — zero static NPM_TOKEN secrets required
        run: npm publish --provenance --access public
